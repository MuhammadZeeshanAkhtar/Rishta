name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token this workflow runs with can read the code and nothing else. It holds no
# secrets, deploys nothing and applies no migration: all of those stay human steps.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Includes the migration and RLS suites. They run against a real Postgres
      # (PGlite, in-process) so no Docker or service container is needed — the
      # migration files are applied exactly as written.
      - name: Test
        run: pnpm test

      # Proves the mobile app actually bundles. A type error is not the same as
      # a Metro resolution failure: the workspace packages ship TypeScript
      # source, so only a real bundle catches a bad import path.
      - name: Build mobile app
        run: pnpm --filter @nikahmate/mobile exec expo export --platform web --output-dir .expo-ci-export

      # Reports drift without blocking: this fails whenever Expo ships a patch
      # release, which is information, not a correctness signal.
      - name: Check Expo dependency alignment
        continue-on-error: true
        run: pnpm --filter @nikahmate/mobile exec expo install --check

      # Proves the production API still bundles (docs/PRODUCTION_SECURITY.md).
      - name: Build production API
        run: pnpm --filter @nikahmate/api build

      # Reports without blocking: some remaining advisories have no fix available, and
      # are explained in docs/PRODUCTION_SECURITY.md. A new one should be read, not
      # allowed to stop an unrelated change.
      - name: Dependency advisories
        continue-on-error: true
        run: pnpm audit --prod

  secrets:
    name: Secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # A narrow, deliberate check for the things this project has committed to
      # never shipping (README principle 3). Not a substitute for a real secret
      # scanner, but it fails fast and costs nothing.
      - name: No service-role keys, AI keys, private keys or .env files
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::A .env file is tracked. Secrets must never be committed."
            exit 1
          fi

          # Supabase service-role JWTs carry this role claim; anon keys do not.
          if git grep -nE '"role"\s*:\s*"service_role"' -- . ':(exclude)docs/**' ':(exclude)*.md'; then
            echo "::error::Possible Supabase service-role key in the repository."
            exit 1
          fi

          # Google API keys (Gemini included) have a fixed, recognisable shape.
          # Gemini is not used in v1 at all, so any match here is a mistake.
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- . ':(exclude)*.md'; then
            echo "::error::Possible Google/Gemini API key in the repository."
            exit 1
          fi

          # A private key has a fixed header. `.key` files are ignored, but a key pasted
          # into a file is not. This workflow is excluded because it names the pattern.
          if git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Possible private key in the repository."
            exit 1
          fi

          # The legacy content and erasure tools' keys belong in a supervised shell only.
          if git grep -nE '(LEGACY_TOOL_STORAGE_KEY|ERASURE_TOOL_SERVICE_KEY)=.+' -- . ':(exclude)*.md' ':(exclude).github/workflows/ci.yml'; then
            echo "::error::A value for a tool's service key is committed."
            exit 1
          fi

          echo "No secrets detected."
